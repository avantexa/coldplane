name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o /dev/null .

      - name: Unit tests
        run: go test ./...

  # The Docker suite against real databases, wired the same way as docker-compose.yml.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -prootpass --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      COLDPLANE_LOCAL_TEST: "1"
      COLDPLANE_TEST_PG_DSN: postgres://testuser:testpass@postgres:5432/testdb?sslmode=disable
      COLDPLANE_TEST_MYSQL_DSN: testuser:testpass@tcp(mysql:3306)/testdb?parseTime=true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Wait for databases
        run: |
          for hostport in postgres:5432 mysql:3306; do
            host=${hostport%:*}; port=${hostport#*:}
            for i in $(seq 1 60); do
              if (exec 3<>/dev/tcp/$host/$port) 2>/dev/null; then echo "$hostport is up"; break; fi
              sleep 2
            done
          done
          sleep 5

      - name: Integration tests
        run: go test -tags integration -count=1 -timeout 10m -v -run 'TestLocal' ./integration/

  # Runs only on the homelab Forgejo instance, after both jobs pass on main.
  # Pushes the verified commit to the public GitHub repo.
  publish-to-github:
    needs: [lint-and-test, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.server_url == 'https://git.lab.home.arpa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to GitHub
        env:
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          test -n "$GH_PUSH_TOKEN" || { echo "GH_PUSH_TOKEN secret is not set"; exit 1; }
          git push "https://x-access-token:${GH_PUSH_TOKEN}@github.com/avantexa/coldplane.git" HEAD:main
